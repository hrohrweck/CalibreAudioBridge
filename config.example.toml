# CalibreAudioBridge configuration example.
# Copy to ~/.config/calibreaudiobridge/config.toml and adjust.
# Layering: defaults <- this file <- CAB__SECTION__KEY env vars <- CLI flags.

[calibre]
library_path = "/Users/you/Calibre Library"
# Optional: use calibre's Content Server when the GUI is running
# (Preferences -> Sharing over the net -> Advanced -> Allow local writes).
# server_url = "http://localhost:8080"
# Only process books carrying this tag (empty = all eligible books):
restrict_tag = ""
calibredb_path = "calibredb"
ebook_convert_path = "ebook-convert"

# Ordered model chain: first entry wins; later entries are fallbacks.
# All entries use the OpenAI-compatible chat API, so Ollama, llama.cpp server,
# LM Studio, vLLM and hosted providers all work.
[[llm.models]]
name = "qwen2.5:14b"
base_url = "http://localhost:11434/v1"
api_key = "ollama"
max_context_tokens = 32768

# Optional hosted last resort:
# [[llm.models]]
# name = "gpt-4o-mini"
# base_url = "https://api.openai.com/v1"
# api_key_env = "OPENAI_API_KEY"
# max_context_tokens = 128000
# price_per_mtok = 0.15

[llm]
concurrency = 2
output_reserve_tokens = 2048
max_attempts_per_model = 3

[preprocess]
# LLM listenability pass (numbers/abbreviations/OCR). Stage-1 rules always run.
enabled = true
drift_min_ratio = 0.7
drift_max_ratio = 1.3

[summary]
target_minutes = 30
words_per_minute = 150

[tts]
default_engine = "kokoro"
speed = 1.0
sentence_pause_ms = 250
paragraph_pause_ms = 600
piper_path = "piper"
piper_model_dir = "~/.local/share/calibreaudiobridge/piper-models"

[tts.voices]
en = "af_heart"
de = "df_anna"

[tts.routing]
en = ["kokoro", "piper"]
de = ["kokoro", "piper"]
default = ["kokoro", "piper", "luxtts"]

[tts.luxtts]
# LuxTTS is English-only zero-shot voice cloning; needs a narrator reference.
reference_wav = "~/.config/calibreaudiobridge/narrator.wav"
num_steps = 4

[audio]
ffmpeg_path = "ffmpeg"
m4b_bitrate = "64k"
mp3_bitrate = "96k"
loudnorm_target = "I=-16:TP=-1.5:LRA=11"

[pipeline]
time_budget_minutes = 240
max_books_per_run = 3
work_dir = "~/.local/state/calibreaudiobridge"
